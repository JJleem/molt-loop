# V0 정지·에스컬레이션 정책 (Runtime이 강제한다. Worker는 읽지도 수정하지도 않는다.)

stop:
  max_attempts: 4
  max_consecutive_failures: 2

stall:
  # V0에서는 감지만 정의하고 자동 대응은 하지 않는다. 초과 시 needs-human.
  identical_tool_calls: 3
  unchanged_error_string: 2
  zero_diff_attempts: 2

escalation:
  retry_max: 1          # transient 실패만
  hint_retry_max: 2     # failure_memo의 lesson을 Context에 주입한 재시도
  then: needs-human     # 사다리가 끝나면 사람 — 단, 아래 triage가 켜져 있으면 Triage가 먼저 본다

# Triage — 사람을 부르기 직전에 먼저 보는 판단 역할 (V0.4). 기본으로 켜져 있다.
# Runtime이 준 메뉴(RERUN_GATES · RERUN_VERIFIER · RETRY_WITH_LESSON · UNBLOCK · REPLAN · ANSWER · ESCALATE)에서만
# 고르고, DONE은 메뉴에 없다. 정책 위반 · 예산 · 보안/비가역 질문은 메뉴에 오지 않는다.
# 아래 숫자는 "판단 예산"이며 위 사다리와 별개로 센다. 섹션을 지우면 이전처럼 곧바로 사람에게 간다.
triage:
  enabled: true
  max_decisions_per_task: 2   # Task당 Triage AI 호출 수
  max_retries_per_task: 1     # 그중 RETRY_WITH_LESSON 횟수
  max_replans_per_plan: 1     # Phase(Plan)당 REPLAN 횟수. start/quick 아래에서만 실행된다
  max_answers_per_plan: 1     # Phase당 Planner 질문 자동 답변 횟수

planning:
  # 하나의 Plan이 제안할 수 있는 최대 Task 수. 초과하면 Plan 검증이 실패한다 —
  # 조용히 잘라내지 않고, 줄여 달라고 다른 AI를 부르지도 않는다.
  max_tasks_per_plan: 12

# 호출 사이에서 검사하는 누적 예산. null은 제한 없음. 기존 기록도 합산한다.
# 실행 중인 호출을 정확한 달러/토큰 경계에서 중단하는 기능은 아니다.
budget:
  task_usd: null
  plan_usd: null
  task_output_tokens: null
  on_unknown_cost: stop          # 예산을 설정한 경우 사용량 미보고/중단된 호출도 확인 필요

verifier:
  max_parallel: 1
  input_excludes:
    - worker_summary
    - worker_self_evaluation
    - progress_narrative
